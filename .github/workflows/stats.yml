name: 生成语言占比卡片

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: layout=compact&langs_count=6&card_width=420&hide_border=true&bg_color=00000000&custom_title=常用语言
    steps:
      - uses: actions/checkout@v6

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.BASE }}&title_color=1f2328&text_color=59636e
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.BASE }}&title_color=f0f6fc&text_color=9198a1
          path: profile/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 提交卡片
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch profile/stats.svg profile/pin-*.svg
          git add profile/*.svg
          git commit -m "chore:更新语言占比卡片" || exit 0
          git push
